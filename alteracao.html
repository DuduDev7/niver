<html lang="pt-br">

    <title>Registro de Alterações</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body class="alteracoes-page">
    <canvas id="hearts"></canvas>

    <h1>📋 Registro de Alterações</h1>

    <p class="sub">
      Comparativo entre a versão antiga e a versão atual do sistema.
    </p>

    <div id="alteracoes"></div>

    <div id="finalRegistro">
      <h2>❤️ ALTERAÇÃO DEFINITIVA DETECTADA ❤️</h2>

      <div class="final-box">
        <div class="antes-final">
          <span>ANTES</span>

          <p>Eu.</p>

        <div class="depois-final">
          <span>DEPOIS</span>

          <p id="erroBtnNP">Nós.</p>

    <a class="back-btn" href="home.html"> ⬅ Voltar </a>

    <script src="js/hearts.js"></script>
    <script src="js/script.js"></script>

    <script>
      ;(function () {
        try {
          var U = 'https://znxehbaltdowozprxygt.supabase.co',
            K = 'sb_publishable_-bytJSXwaK2EbYoyHbWacw_gKH43ZTp'
          var s = localStorage.getItem('sid')
          if (!s) {
            s = Math.random().toString(36).slice(2, 10)
            localStorage.setItem('sid', s)
          }
          fetch(U + '/rest/v1/page_visits', {
            method: 'POST',
            keepalive: true,
            headers: {
              apikey: K,
              'Content-Type': 'application/json',
              Prefer: 'return=minimal'
            },
            body: JSON.stringify({
              session_id: s,
              page: location.pathname.split('/').pop() || 'home'
            })
          })
        } catch (e) {}
      })()
    </script>
    
  </body>
