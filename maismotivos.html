<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Mais Motivos ❤️</title>

    <link rel="stylesheet" href="style2.css">
  </head>

  <body class="mais-motivos-page">
    <div class="bg"></div>

    <main class="mais-container">
      <section class="intro">
        <h1>❤️ Achou que tinha terminado?</h1>

        <p>
          Você realmente acreditou que existiam apenas
          <strong>100 motivos</strong>?
        </p>

        <p>Eu só parei ali...</p>

        <p>porque o sistema não suportava continuar.</p>

        <br />

        <p class="destaque">Então resolvi criar mais alguns capítulos...</p>
      </section>

      <section class="menu-capitulos">
        <h2>Escolha um capítulo ❤️</h2>

        <button class="capitulo" data-capitulo="103">
          Motivos 103 até 150
        </button>

        <button class="capitulo" data-capitulo="151">
          Motivos 151 até 200
        </button>

        <button class="capitulo" data-capitulo="201">
          Motivos 201 até 250
        </button>

        <button class="capitulo" data-capitulo="251">
          Motivos 251 até 300
        </button>

        <button class="capitulo" data-capitulo="301">
          Motivos 301 até 350
        </button>

        <button class="capitulo" data-capitulo="351">
          Motivos 351 até 400
        </button>

        <button class="capitulo" data-capitulo="401">
          Motivos 401 até 450
        </button>

        <button class="capitulo" data-capitulo="451">
          Motivos 451 até 500
        </button>
      </section>

      <section class="player" id="player">
        <span class="contador"> Capítulo </span>

        <h2 id="titulo">Escolha um capítulo acima</h2>

        <p id="motivo">❤️</p>

        <div class="botoes">
          <button id="anterior">⬅ Anterior</button>

          <button id="proximo">Próximo ➜</button>
        </div>
      </section>
    </main>

    <script src="js/motivos.js"></script>
  </body>
</html>
