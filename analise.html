<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Analise</title>
  </head>
  <body class="center">
    <canvas id="hearts"></canvas>

    <div class="container analise-box">
      <h1>Analisando jogadora...</h1>

      <div class="requisitos">
        <div class="item">
          <span>📈 Resenha acima da média</span>
          <span class="check hidden">✔</span>
        </div>

        <div class="item">
          <span>🏃 Corre atrás quando necessário</span>
          <span class="check hidden">✔</span>
        </div>

        <div class="item">
          <span>❤️ Carinho em tempo integral</span>
          <span class="check hidden">✔</span>
        </div>

        <div class="item">
          <span>😂 Capacidade de me aguentar</span>
          <span class="check hidden">✔</span>
        </div>

        <div class="item">
          <span>😍 Beleza totalmente apelona</span>
          <span class="check hidden">✔</span>
        </div>
      </div>

      <p id="resultado" class="resultado hidden">
        Jogadora aprovada com sucesso ✔✔
      </p>
    </div>

    <a class="back-btn" href="home.html"> ⬅ Voltar </a>

    <script src="js/hearts.js"></script>
    <script src="js/script.js"></script>
  </body>
</html>
