<!DOCTYPE html>

<html lang="pt-BR">
<head>

  <meta charset="UTF-8">

  <meta
  name="viewport"
  content="width=device-width, initial-scale=1.0">

  <title>Tempo</title>

  <link rel="stylesheet" href="style.css">

</head>

<body class="relogio-page">

  <div class="container-tempo">

    <div class="painel">

      <h1>
        ⏳ Arquivo Temporal
      </h1>

      <p class="subtitulo">

        Algumas coisas mudam com o tempo.

        <br>

        Outras só ficam mais especiais.

      </p>

      <button id="iniciarTempo">

        Iniciar Contagem

      </button>

      <div
      id="contador"
      style="display:none;">

        <div class="tempo-box">

          <span id="dias">
            0
          </span>

          <small>Dias</small>

        </div>

        <div class="tempo-box">

          <span id="horas">
            0
          </span>

          <small>Horas</small>

        </div>

        <div class="tempo-box">

          <span id="minutos">
            0
          </span>

          <small>Minutos</small>

        </div>

        <div class="tempo-box">

          <span id="segundos">
            0
          </span>

          <small>Segundos</small>

        </div>

      </div>

      <div
      id="mensagemFinal">

        <p>

          Algumas pessoas passam pela nossa vida.

        </p>

        <p>

          Você mudou a minha.

        </p>

      </div>

      <button
      id="continuar">

        Continuar transmissão

      </button>

    </div>

  </div>

  <script src="js/script.js"></script>

</body>
</html>
