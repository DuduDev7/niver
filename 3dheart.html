<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love Heart For Her</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background-color: #020106;
            font-family: 'Arial', sans-serif;
            user-select: none;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            cursor: grab;
        }
        
        #canvas-container:active {
            cursor: grabbing;
        }

        .title {
            position: absolute;
            top: 8%;
            left: 50%;
            transform: translateX(-50%);
            color: #ffffff;
            font-size: 1.8rem;
            font-style: italic;
            font-weight: 300;
            letter-spacing: 2px;
            z-index: 10;
            pointer-events: none;
            text-shadow: 0 0 15px rgba(255,255,255,0.6);
            text-align: center;
            width: 100%;
        }

        .subtitle {
            position: absolute;
            top: 16%;
            left: 50%;
            transform: translateX(-50%);
            color: #ffffff;
            font-size: 0.8rem;
            font-weight: bold;
            opacity: 0.7;
            z-index: 10;
            pointer-events: none;
            text-align: center;
            width: 100%;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div class="title">Para Meu Amor</div>
    <div class="subtitle">Um pedaço do universo feito pra você</div>
    <div id="canvas-container"></div>

    <script>
        // --- Configuração da Cena ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x020106, 0.015);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        // CRUCIAL: Câmera jogada lá para trás (Z=45) para o coração começar minúsculo e longe!
        camera.position.set(0, 0, 100);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // --- Controles Orbitais Avançados ---
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 2;   // Permite chegar colado no coração
        controls.maxDistance = 80;  // Limite máximo para não se perder no infinito

        // --- Iluminação Espacial Vibrante ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        const coreLight = new THREE.PointLight(0xff1493, 3.5, 25);
        coreLight.position.set(0, 0, 0);
        scene.add(coreLight);

        const neonBlueLight = new THREE.DirectionalLight(0x00ffff, 1.2);
        neonBlueLight.position.set(10, 10, 10);
        scene.add(neonBlueLight);

        // --- 1. Coração Central Geométrico (Ponta para Baixo) ---
        const heartShape = new THREE.Shape();
        heartShape.moveTo(0, 0.7);
        heartShape.bezierCurveTo(0.6, 1.4, 1.9, 1.4, 1.9, 0.4);
        heartShape.bezierCurveTo(1.9, -0.6, 0.8, -1.3, 0, -2.1); 
        heartShape.bezierCurveTo(-0.8, -1.3, -1.9, -0.6, -1.9, 0.4);
        heartShape.bezierCurveTo(-1.9, 1.4, -0.6, 1.4, 0, 0.7);

        const extrudeSettings = {
            depth: 0.5,
            bevelEnabled: true,
            bevelSegments: 2,
            steps: 1,
            bevelSize: 0.12,
            bevelThickness: 0.12
        };

        const heartGeometry = new THREE.ExtrudeGeometry(heartShape, extrudeSettings);
        heartGeometry.center(); 

        const heartMaterial = new THREE.MeshStandardMaterial({
            color: 0xff1493,
            roughness: 0.1,
            metalness: 0.8,
            flatShading: true 
        });

        const heartMesh = new THREE.Mesh(heartGeometry, heartMaterial);
        heartMesh.scale.set(0.8, 0.8, 0.8);
        scene.add(heartMesh);


        // --- 2. Rastro de Partículas do Coração ---
        const pCount = 3000; 
        const particleGeometry = new THREE.BufferGeometry();
        const positions = new Float32Array(pCount * 3);
        const colors = new Float32Array(pCount * 3);
        const randoms = new Float32Array(pCount);
        const colorChoices = [0xff1493, 0xff69b4, 0xffffff, 0x00ffaa, 0xffd700]; 

        for (let i = 0; i < pCount; i++) {
            const t = Math.random() * Math.PI * 2;
            const x = 16 * Math.pow(Math.sin(t), 3) * 0.25;
            const y = (13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t)) * 0.25;
            const z = (Math.random() - 0.5) * 1.8;

            positions[i * 3] = x;
            positions[i * 3 + 1] = y; 
            positions[i * 3 + 2] = z;

            randoms[i] = Math.random();

            const chosenColor = new THREE.Color(colorChoices[Math.floor(Math.random() * colorChoices.length)]);
            colors[i * 3] = chosenColor.r;
            colors[i * 3 + 1] = chosenColor.g;
            colors[i * 3 + 2] = chosenColor.b;
        }

        particleGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        particleGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        const particleMaterial = new THREE.PointsMaterial({
            size: 0.09,
            vertexColors: true,
            transparent: true,
            opacity: 0.9,
            blending: THREE.AdditiveBlending
        });

        const particleSystem = new THREE.Points(particleGeometry, particleMaterial);
        scene.add(particleSystem);


        // --- 3. Super Nebulosa Colorida de Fundo (15.000 Estrelas) ---
        const starsCount = 15000;
        const starsGeometry = new THREE.BufferGeometry();
        const starsPositions = new Float32Array(starsCount * 3);
        const starsColors = new Float32Array(starsCount * 3);

        for(let i = 0; i < starsCount * 3; i += 3) {
            // Distribuição volumétrica em camadas para cobrir todo o campo de visão de perto a longe
            const radius = 5 + Math.random() * 75; 
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos((Math.random() * 2) - 1);
            
            starsPositions[i] = radius * Math.sin(phi) * Math.cos(theta);
            starsPositions[i+1] = radius * Math.sin(phi) * Math.sin(theta);
            starsPositions[i+2] = radius * Math.cos(phi);

            // Mix de cores vibrantes galácticas (Neon Pink, Ciano, Roxo e Ouro)
            const rand = Math.random();
            if(rand < 0.3) {
                starsColors[i] = 1.0; starsColors[i+1] = 0.05; starsColors[i+2] = 0.55; // Pink Neon
            } else if(rand < 0.6) {
                starsColors[i] = 0.0; starsColors[i+1] = 0.85; starsColors[i+2] = 1.0;  // Cyan/Azul
            } else if(rand < 0.85) {
                starsColors[i] = 0.5; starsColors[i+1] = 0.0; starsColors[i+2] = 0.9;   // Roxo Psicodélico
            } else {
                starsColors[i] = 1.0; starsColors[i+1] = 0.85; starsColors[i+2] = 0.3;  // Poeira Estelar Dourada
            }
        }

        starsGeometry.setAttribute('position', new THREE.BufferAttribute(starsPositions, 3));
        starsGeometry.setAttribute('color', new THREE.BufferAttribute(starsColors, 3));

        const starsMaterial = new THREE.PointsMaterial({
            size: 0.14,
            vertexColors: true,
            transparent: true,
            opacity: 0.75,
            blending: THREE.AdditiveBlending // Faz as cores se misturarem e brilharem juntas
        });

        const starField = new THREE.Points(starsGeometry, starsMaterial);
        scene.add(starField);


        // --- Interatividade de Toque/Clique ---
        let isInteracting = false;
        window.addEventListener('mousedown', () => isInteracting = true);
        window.addEventListener('mouseup', () => isInteracting = false);
        window.addEventListener('touchstart', () => isInteracting = true);
        window.addEventListener('touchend', () => isInteracting = false);


        // --- 4. Loop de Animação ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const elapsedTime = clock.getElapsedTime();
            
            // Ritmo dinâmico de batimento (acelera quando interage)
            const speedMultiplier = isInteracting ? 5.5 : 2.5;
            const pulse = 0.8 + Math.sin(elapsedTime * speedMultiplier) * 0.04;
            heartMesh.scale.set(pulse, pulse, pulse);

            // Rotação sutil do coração
            heartMesh.rotation.y = elapsedTime * 0.2;
            heartMesh.rotation.z = Math.sin(elapsedTime * 0.4) * 0.05;

            // Movimento fluido nas partículas do contorno do coração
            const positionsAttribute = particleGeometry.attributes.position;
            for (let i = 0; i < pCount; i++) {
                positionsAttribute.array[i * 3] += Math.sin(elapsedTime + randoms[i] * 5) * 0.0015;
                positionsAttribute.array[i * 3 + 1] += Math.cos(elapsedTime + randoms[i] * 5) * 0.0015;
            }
            positionsAttribute.needsUpdate = true;

            // Rotação contínua da nebulosa de fundo, criando um efeito imersivo
            starField.rotation.y = elapsedTime * 0.02;
            starField.rotation.x = elapsedTime * 0.01;

            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        // --- Ajuste de Tela Responsivo ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
