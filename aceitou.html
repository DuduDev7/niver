<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Dupla Oficial</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body class="center">
    <canvas id="canvas"></canvas>

    <div class="container final-box">
      <h1 class="titulo-final">Parabéns 🤎</h1>

      <p class="texto-final">
        Agora você oficialmente virou minha dupla de futevôlei.
      </p>

      <p class="texto-final">Isso significa:</p>

      <div class="lista-final">
        <div class="item-final">🏐 Muitos jogos juntos</div>

        <div class="item-final">😂 Resenha infinita</div>

        <div class="item-final">☀ Reclamar do calor</div>

        <div class="item-final">🤝 Parceria obrigatória</div>

        <div class="item-final">🥇 Futuras vitórias</div>
      </div>

      <p class="mensagem-final">Obrigado por aceitar entrar nessa comigo.</p>

      <button onclick="soltarCoracoes()">🤎 comemorar</button>
    </div>
    <div class="voltar">
      <a class="back-btn" href="home.html">⬅ Voltar</a>
    </div>

    <script src="js/hearts.js"></script>

    <script>
      function soltarCoracoes() {
        for (let i = 0; i < 80; i++) {
          setTimeout(() => {
            criarExplosao()
          }, i * 40)
        }
      }

      function criarExplosao() {
        const emoji = document.createElement('div')

        const elementos = ['🤎', '🏐', '4']

        emoji.innerText =
          elementos[Math.floor(Math.random() * elementos.length)]

        emoji.style.position = 'fixed'

        emoji.style.left = Math.random() * window.innerWidth + 'px'

        emoji.style.top = window.innerHeight + 'px'

        emoji.style.fontSize = Math.random() * 20 + 25 + 'px'

        emoji.style.zIndex = '9999'

        emoji.style.pointerEvents = 'none'

        emoji.style.transition = 'transform 3s linear, opacity 3s'

        document.body.appendChild(emoji)

        setTimeout(() => {
          emoji.style.transform = `translateY(-${window.innerHeight + 200}px)
           rotate(${Math.random() * 360}deg)`

          emoji.style.opacity = '0'
        }, 50)

        setTimeout(() => {
          emoji.remove()
        }, 3000)
      }
    </script>
  </body>
</html>
