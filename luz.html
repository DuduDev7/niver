<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Uma Luz Para Nós</title>

    <link rel="stylesheet" href="style2.css">

</head>

<body>

    <!-- Fundo -->
    <div class="bg"></div>

    <!-- Brilho ambiente -->
    <div id="lightGlow"></div>

    <!-- Partículas -->
    <div id="particles"></div>

    <!-- Luminária -->
    <section class="lamp-area">

        <div class="wire"></div>

        <div class="pull-string" id="pullString">

            <div class="string"></div>

            <div class="knob"></div>

        </div>

        <div class="lamp">

            <div class="lamp-top"></div>

            <div class="lamp-light" id="lampLight"></div>

        </div>

    </section>

    <!-- Cone de luz -->
    <div class="light-cone" id="lightCone"></div>

    <!-- Texto -->
    <section class="message" id="message">

        <h1 id="titulo"></h1>
    
        <p id="linha1"></p>
    
        <p id="linha2"></p>
    
        <p id="linha3"></p>
    
        <h2 id="linhaFinal"></h2>
    
        <button id="btnVoltar" onclick="go('home.html')">
    
            ❤️ Voltar
    
        </button>
    
    </section>

    <script src="js/script2.js"></script>

</body>
</html>
