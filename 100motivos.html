<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>100 Motivos</title>

  <link rel="stylesheet" href="style2.css">

</head>

<body class="motivos-page">

  <div class="bg"></div>

  <main class="motivos-container">

    <!-- CARD -->
    <section class="motivos-card" id="card">

      <span class="contador" id="contador">
        Motivo 1 de 100
      </span>

      <h1 id="titulo">
        Motivo #1
      </h1>

      <p id="texto">
        Seu sorriso.
      </p>

      <button id="btn">
        Próximo ❤️
      </button>

    </section>

  </main>

  <!-- TELA FINAL -->

  <section class="final" id="final">

    <div class="final-box" id="finalBox">

      <p class="digitando" id="digitando">
        Calculando quantidade de motivos...
      </p>

    </div>

  </section>

  <script src="js/script2.js"></script>

</body>
</html>
