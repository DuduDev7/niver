<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>100 Motivos</title>

  <link rel="stylesheet" href="style2.css">

</head>

<body class="motivos-page">

  <div class="bg"></div>

  <main class="container">

    <!-- INTRODUÇÃO -->

    <section class="card ativa" id="card">

      <small class="status">
        Registro Particular • Nível Máximo
      </small>

      <h1 id="titulo">
        100 motivos...
      </h1>

      <p id="texto">

        Você provavelmente nunca vai acreditar quando eu disser que existem milhares de motivos para eu gostar de você.

      </p>

      <p>

        Então eu resolvi começar pelos primeiros.

      </p>

      <br>

      <p class="destaque">

        Aperte o botão.

      </p>

      <button id="btn">

        Começar

      </button>

    </section>

    <!-- FINAL -->

    <section class="final" id="final">

      <div class="final-box" id="finalBox">

        <h2 id="statusSistema">

          Calculando quantidade de motivos...

        </h2>

      </div>

    </section>

  </main>

  <script src="js/script2.js"></script>

</body>

</html>
