<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Animação de Partículas Especial ✨</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Inter:wght@300;400;600;700&family=Fira+Code:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-user-select: none;
      }

      body,
      html {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #030206;
        font-family: 'Inter', sans-serif;
        color: #fff;
      }

      .font-cursive {
        font-family: 'Great Vibes', cursive;
      }

      .font-code {
        font-family: 'Fira Code', monospace;
      }

      /* Glassmorphism Card */
      .glass-card {
        background: rgba(15, 10, 26, 0.85);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 182, 193, 0.25);
        box-shadow: 0 0 40px rgba(236, 72, 153, 0.2),
          inset 0 0 15px rgba(255, 182, 193, 0.1);
      }

      .btn-romantic {
        background: linear-gradient(
          135deg,
          #ec4899 0%,
          #8b5cf6 50%,
          #d946ef 100%
        );
        background-size: 200% 200%;
        animation: gradientShift 4s ease infinite;
        box-shadow: 0 0 20px rgba(236, 72, 153, 0.4);
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .btn-romantic:hover {
        box-shadow: 0 0 35px rgba(236, 72, 153, 0.8);
        transform: translateY(-2px) scale(1.02);
      }

      .btn-secondary {
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
        backdrop-filter: blur(8px);
        transition: all 0.2s ease;
      }

      .btn-secondary:hover {
        background: rgba(255, 255, 255, 0.2);
        transform: scale(1.05);
      }

      @keyframes gradientShift {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }

      @keyframes pulseGlow {
        0%, 100% { opacity: 0.6; transform: scale(0.98); }
        50% { opacity: 1; transform: scale(1.02); }
      }

      .pulse-text {
        animation: pulseGlow 2.5s infinite ease-in-out;
      }

      .fade-overlay {
        transition: opacity 0.8s ease;
      }
    </style>
  </head>
  <body class="relative w-full h-full bg-[#030206] text-white overflow-hidden flex flex-col justify-between items-center">
    
    <!-- Canvas de Animação -->
    <div class="fixed inset-0 w-full h-full z-0">
      <canvas id="particleCanvas" class="w-full h-full block cursor-pointer"></canvas>
    </div>

    <!-- Interface Principal -->
    <div id="uiOverlay" class="relative z-10 w-full h-full flex flex-col justify-between items-center p-6 pointer-events-none fade-overlay">
      <div class="mt-4 text-center">
        <p class="pulse-text text-xs sm:text-sm uppercase tracking-widest text-pink-200/90 font-code drop-shadow-[0_0_10px_rgba(236,72,153,0.5)]">
          ✨ Toque na tela para soltar brilhos ✨
        </p>
      </div>

      <!-- Botoes de Ação -->
      <div class="mb-6 pointer-events-auto flex flex-col sm:flex-row items-center gap-3">
        <button
          onclick="nextShape()"
          class="btn-secondary px-6 py-3 rounded-full text-xs sm:text-sm font-semibold tracking-wider text-pink-200 flex items-center gap-2 cursor-pointer"
        >
          <span>🔄 PRÓXIMA FORMA</span>
        </button>

        <button
          id="btnNext"
          onclick="openMessageScreen()"
          class="btn-romantic px-8 py-3.5 rounded-full text-sm sm:text-base font-semibold tracking-wider text-white flex items-center gap-3 cursor-pointer"
        >
          <span>VER MENSAGEM ♥</span>
        </button>
      </div>
    </div>

    <!-- Modal de Mensagem -->
    <div
      id="messageOverlay"
      class="fixed inset-0 z-20 flex items-center justify-center p-4 bg-black/70 opacity-0 pointer-events-none fade-overlay"
    >
      <div class="glass-card max-w-xl w-full rounded-3xl p-6 sm:p-10 text-center transform scale-95 transition-all duration-500">
        <div class="text-4xl sm:text-5xl mb-3 animate-pulse">☀️🌊⚽</div>

        <h1 class="text-3xl sm:text-5xl font-bold font-cursive text-transparent bg-clip-text bg-gradient-to-r from-pink-300 via-rose-200 to-amber-200 mb-6 drop-shadow-[0_0_20px_rgba(236,72,153,0.4)]">
          Para o Meu Grande Amor
        </h1>

        <div class="space-y-4 text-sm sm:text-base text-pink-100/90 leading-relaxed font-light mb-8">
          <p>
            Do sol ao mar, de cada jogada de futevôlei a todos os nossos momentos juntos...
          </p>
          <p class="font-normal text-pink-200">
            Cada detalhe em você transforma o meu mundo em um lugar infinitamente mais especial.
          </p>
          <p class="text-lg sm:text-xl font-bold text-pink-300 font-cursive tracking-wide pt-2">
            Te amo para sempre! ✨
          </p>
        </div>

        <button
          onclick="closeMessageScreen()"
          class="px-6 py-2.5 rounded-full border border-pink-400/30 bg-pink-500/10 hover:bg-pink-500/20 text-pink-200 text-sm font-medium transition-all duration-300 hover:scale-105 cursor-pointer"
        >
          ↺ Ver Animação Novamente
        </button>
      </div>
    </div>

    <script>
      const canvas = document.getElementById('particleCanvas')
      const ctx = canvas.getContext('2d')

      let width = window.innerWidth
      let height = window.innerHeight

      // Reduzido para garantir 60 FPS fluídos em qualquer dispositivo
      const NUM_PARTICLES = 450
      let particles = []
      let burstParticles = []

      let currentShapeIndex = 0
      let isDispersed = false
      let autoSwitchTimer = null

      const mouse = { x: -2000, y: -2000, radius: 90 }

      function resizeCanvas() {
        const dpr = window.devicePixelRatio || 1
        width = window.innerWidth
        height = window.innerHeight
        canvas.width = width * dpr
        canvas.height = height * dpr
        ctx.scale(dpr, dpr)
        updateParticleTargets()
      }

      // --- GERADORES DE FORMAS GEOMÉTRICAS SIMPLES ---
      function getShapeTargets(index) {
        const targets = []
        const cx = width / 2
        const cy = height / 2
        const scale = Math.min(width, height) * 0.3

        switch (index % 5) {
          case 0: // SOL ☀️
            for (let i = 0; i < NUM_PARTICLES; i++) {
              if (i < NUM_PARTICLES * 0.6) {
                const r = Math.sqrt(Math.random()) * (scale * 0.5)
                const a = Math.random() * Math.PI * 2
                targets.push({
                  x: cx + r * Math.cos(a),
                  y: cy + r * Math.sin(a),
                  color: '#FFB300'
                })
              } else {
                const a = Math.random() * Math.PI * 2
                const r = scale * 0.5 + Math.random() * (scale * 0.35)
                targets.push({
                  x: cx + r * Math.cos(a),
                  y: cy + r * Math.sin(a),
                  color: '#FF6D00'
                })
              }
            }
            break

          case 1: // MAR / ONDAS 🌊
            for (let i = 0; i < NUM_PARTICLES; i++) {
              const row = i % 4
              const x = cx - scale + (Math.random() * scale * 2)
              const yWave = cy - (scale * 0.3) + row * 25 + Math.sin(x * 0.02) * 15
              targets.push({
                x: x,
                y: yWave,
                color: row % 2 === 0 ? '#00E5FF' : '#0091EA'
              })
            }
            break

          case 2: // LETRA "J"
            for (let i = 0; i < NUM_PARTICLES; i++) {
              const p = i / NUM_PARTICLES
              let x, y
              if (p < 0.25) {
                // Barra superior
                x = cx - scale * 0.4 + p * 4 * (scale * 0.8)
                y = cy - scale * 0.8
              } else if (p < 0.7) {
                // Haste vertical
                x = cx + scale * 0.1
                y = cy - scale * 0.8 + (p - 0.25) * (1 / 0.45) * (scale * 1.2)
              } else {
                // Curva inferior
                const a = Math.PI * (p - 0.7) * (1 / 0.3)
                x = cx - scale * 0.15 + Math.cos(a + Math.PI / 2) * (scale * 0.25)
                y = cy + scale * 0.4 + Math.sin(a + Math.PI / 2) * (scale * 0.25)
              }
              targets.push({
                x: x + (Math.random() - 0.5) * 8,
                y: y + (Math.random() - 0.5) * 8,
                color: '#EC4899'
              })
            }
            break

          case 3: // NÚMERO "4"
            for (let i = 0; i < NUM_PARTICLES; i++) {
              const p = i / NUM_PARTICLES
              let x, y
              if (p < 0.35) {
                // Linha diagonal esquerda
                x = cx + scale * 0.1 - p * (1 / 0.35) * (scale * 0.5)
                y = cy - scale * 0.7 + p * (1 / 0.35) * (scale * 0.8)
              } else if (p < 0.65) {
                // Linha horizontal
                x = cx - scale * 0.4 + (p - 0.35) * (1 / 0.3) * (scale * 0.7)
                y = cy + scale * 0.1
              } else {
                // Linha vertical
                x = cx + scale * 0.1
                y = cy - scale * 0.7 + (p - 0.65) * (1 / 0.35) * (scale * 1.4)
              }
              targets.push({
                x: x + (Math.random() - 0.5) * 8,
                y: y + (Math.random() - 0.5) * 8,
                color: '#D946EF'
              })
            }
            break

          case 4: // BOLA DE FUTEVÔLEI ⚽
            const rBall = scale * 0.6
            for (let i = 0; i < NUM_PARTICLES; i++) {
              const a = Math.random() * Math.PI * 2
              const r = Math.sqrt(Math.random()) * rBall
              const px = cx + r * Math.cos(a)
              const py = cy + r * Math.sin(a)
              
              // Gomos / Desenho da bola de vôlei
              const isPattern = Math.abs(Math.sin((px - cx) * 0.03)) > 0.6 || Math.abs(Math.cos((py - cy) * 0.03)) > 0.6
              targets.push({
                x: px,
                y: py,
                color: isPattern ? '#FFD54F' : '#FFFFFF'
              })
            }
            break
        }
        return targets
      }

      function initParticles() {
        particles = []
        const targets = getShapeTargets(0)
        for (let i = 0; i < NUM_PARTICLES; i++) {
          particles.push({
            x: Math.random() * width,
            y: Math.random() * height,
            targetX: targets[i].x,
            targetY: targets[i].y,
            color: targets[i].color,
            size: Math.random() * 2.5 + 1.5,
            baseSize: Math.random() * 2.5 + 1.5,
            speed: 0.04 + Math.random() * 0.04,
            vx: 0,
            vy: 0
          })
        }
      }

      function updateParticleTargets() {
        const targets = getShapeTargets(currentShapeIndex)
        for (let i = 0; i < particles.length; i++) {
          particles[i].targetX = targets[i].x
          particles[i].targetY = targets[i].y
          particles[i].color = targets[i].color
        }
      }

      function nextShape() {
        currentShapeIndex = (currentShapeIndex + 1) % 5
        updateParticleTargets()
        resetAutoTimer()
      }

      function resetAutoTimer() {
        if (autoSwitchTimer) clearInterval(autoSwitchTimer)
        autoSwitchTimer = setInterval(() => {
          if (!isDispersed) {
            currentShapeIndex = (currentShapeIndex + 1) % 5
            updateParticleTargets()
          }
        }, 4000)
      }

      function createClickBurst(x, y) {
        const colors = ['#FF80AB', '#00E5FF', '#FFD54F', '#E879F9']
        for (let i = 0; i < 25; i++) {
          const angle = Math.random() * Math.PI * 2
          const speed = Math.random() * 5 + 2
          burstParticles.push({
            x: x,
            y: y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            color: colors[Math.floor(Math.random() * colors.length)],
            size: Math.random() * 3 + 1.5,
            life: 1.0,
            decay: Math.random() * 0.03 + 0.02
          })
        }
      }

      function animate() {
        // Fundo com leve rastro transparente para suavidade
        ctx.fillStyle = 'rgba(3, 2, 6, 0.25)'
        ctx.fillRect(0, 0, width, height)

        for (let i = 0; i < particles.length; i++) {
          const p = particles[i]

          if (isDispersed) {
            p.x += p.vx
            p.y += p.vy
            p.vx *= 0.96
            p.vy *= 0.96
          } else {
            // Movimento suave e direto ao ponto
            p.x += (p.targetX - p.x) * p.speed
            p.y += (p.targetY - p.y) * p.speed

            // Interação simples com mouse/touch
            const mdx = p.x - mouse.x
            const mdy = p.y - mouse.y
            const dist = Math.hypot(mdx, mdy)

            if (dist < mouse.radius) {
              const force = (mouse.radius - dist) / mouse.radius
              const angle = Math.atan2(mdy, mdx)
              p.x += Math.cos(angle) * force * 8
              p.y += Math.sin(angle) * force * 8
              p.size = p.baseSize * (1 + force * 1.5)
            } else {
              p.size += (p.baseSize - p.size) * 0.1
            }
          }

          // Desenho otimizado da partícula
          ctx.beginPath()
          ctx.arc(p.x, p.y, Math.max(0.1, p.size), 0, Math.PI * 2)
          ctx.fillStyle = p.color
          ctx.fill()
        }

        // Partículas do clique
        for (let i = burstParticles.length - 1; i >= 0; i--) {
          const bp = burstParticles[i]
          bp.x += bp.vx
          bp.y += bp.vy
          bp.life -= bp.decay

          if (bp.life <= 0) {
            burstParticles.splice(i, 1)
            continue
          }

          ctx.beginPath()
          ctx.arc(bp.x, bp.y, Math.max(0.1, bp.size * bp.life), 0, Math.PI * 2)
          ctx.fillStyle = bp.color
          ctx.fill()
        }

        requestAnimationFrame(animate)
      }

      // Eventos
      window.addEventListener('resize', () => {
        resizeCanvas()
      })

      window.addEventListener('mousemove', e => {
        mouse.x = e.clientX
        mouse.y = e.clientY
      })

      window.addEventListener('touchmove', e => {
        if (e.touches.length > 0) {
          mouse.x = e.touches[0].clientX
          mouse.y = e.touches[0].clientY
        }
      }, { passive: true })

      window.addEventListener('mouseleave', () => {
        mouse.x = -2000
        mouse.y = -2000
      })

      window.addEventListener('click', e => {
        if (e.target.tagName !== 'BUTTON') {
          createClickBurst(e.clientX, e.clientY)
        }
      })

      function openMessageScreen() {
        isDispersed = true
        particles.forEach(p => {
          const angle = Math.random() * Math.PI * 2
          const force = Math.random() * 10 + 3
          p.vx = Math.cos(angle) * force
          p.vy = Math.sin(angle) * force
        })

        const uiOverlay = document.getElementById('uiOverlay')
        const messageOverlay = document.getElementById('messageOverlay')

        uiOverlay.style.opacity = '0'
        uiOverlay.style.pointerEvents = 'none'

        setTimeout(() => {
          messageOverlay.classList.remove('pointer-events-none')
          messageOverlay.style.opacity = '1'
          messageOverlay.querySelector('.glass-card').classList.remove('scale-95')
          messageOverlay.querySelector('.glass-card').classList.add('scale-100')
        }, 300)
      }

      function closeMessageScreen() {
        isDispersed = false

        const uiOverlay = document.getElementById('uiOverlay')
        const messageOverlay = document.getElementById('messageOverlay')

        messageOverlay.style.opacity = '0'
        messageOverlay.classList.add('pointer-events-none')
        messageOverlay.querySelector('.glass-card').classList.remove('scale-100')
        messageOverlay.querySelector('.glass-card').classList.add('scale-95')

        setTimeout(() => {
          uiOverlay.style.opacity = '1'
          uiOverlay.style.pointerEvents = 'auto'
          updateParticleTargets()
        }, 400)
      }

      window.onload = () => {
        resizeCanvas()
        initParticles()
        animate()
        resetAutoTimer()
      }
    </script>
  </body>
</html>
