<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aviso do Sistema</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #050005;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        /* Canvas da chuva hacker de fundo */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        /* Terminal sobreposto ao canvas */
        .terminal {
            width: 90%;
            max-width: 600px;
            background: rgba(5, 0, 5, 0.9); /* Fundo escuro semi-transparente */
            border: 2px solid #00ff66;
            border-radius: 8px;
            padding: 25px;
            box-shadow: 0 0 30px rgba(0, 255, 102, 0.2), 0 0 30px rgba(255, 40, 140, 0.2);
            position: relative;
            z-index: 2;
        }
        .terminal-header {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(0, 255, 102, 0.3);
            padding-bottom: 10px;
        }
        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: #00ff66;
            opacity: 0.6;
        }
        .dot.pink {
            background-color: #ff288c;
        }
        .output {
            font-size: 16px;
            line-height: 1.6;
            min-height: 180px;
            white-space: pre-wrap;
            margin-bottom: 30px;
            color: #00ff66; /* Texto principal em verde */
            text-shadow: 0 0 5px rgba(0, 255, 102, 0.5);
        }
        /* Destaca partes do texto em rosa dentro do terminal */
        .pink-text {
            color: #ff288c;
            text-shadow: 0 0 5px rgba(255, 40, 140, 0.5);
        }
        .blink {
            animation: blinker 1s linear infinite;
            font-weight: bold;
        }
        @keyframes blinker {
            50% { opacity: 0; }
        }
        .btn-container {
            display: flex;
            justify-content: center;
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }
        .btn-container.show {
            opacity: 1;
        }
        .action-btn {
            background: transparent;
            border: 2px solid #ff288c;
            color: #ff288c;
            padding: 12px 30px;
            font-family: 'Arial Black', sans-serif;
            font-size: 14px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(255, 40, 140, 0.2);
        }
        .action-btn:hover {
            background: #00ff66;
            border-color: #00ff66;
            color: #050005;
            box-shadow: 0 0 25px #00ff66, 0 0 50px rgba(0, 255, 102, 0.5);
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <canvas id="bgCanvas"></canvas>

    <div class="terminal">
        <div class="terminal-header">
            <div class="dot"></div>
            <div class="dot pink"></div>
            <div class="dot"></div>
            <span style="font-size: 12px; margin-left: auto; opacity: 0.7; color: #00ff66;">SYSTEM_OVERRIDE.LOG</span>
        </div>
        <div class="output" id="terminalText"></div>
        <div class="btn-container" id="btnContainer">
            <button class="action-btn" onclick="bypassSystem()">Descriptografar Sentimentos</button>
        </div>
    </div>

    <script>
        // --- 1. CONFIGURAÇÃO DA CHUVA HACKER (VERDE E ROSA) ---
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const chars = "01EUTEAMOILOVEYOU10♥".split("");
        const fontSize = 14;
        let columns = Math.floor(canvas.width / fontSize);
        let rainDrops = Array(columns).fill(1);

        window.addEventListener('resize', () => {
            columns = Math.floor(canvas.width / fontSize);
            rainDrops = Array(columns).fill(1);
        });

        function drawMatrix() {
            ctx.fillStyle = 'rgba(5, 0, 5, 0.08)'; // Rastro preto sutil
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.font = fontSize + 'px monospace';
            for (let i = 0; i < rainDrops.length; i++) {
                const char = chars[Math.floor(Math.random() * chars.length)];
                
                // Escolha alternada entre Verde Neon e Rosa Choque para o fundo
                if (Math.random() > 0.5) {
                    ctx.fillStyle = `rgba(0, 255, 102, ${Math.random() * 0.15 + 0.05})`; // Verde fraco de fundo
                } else {
                    ctx.fillStyle = `rgba(255, 40, 140, ${Math.random() * 0.15 + 0.05})`; // Rosa fraco de fundo
                }

                ctx.fillText(char, i * fontSize, rainDrops[i] * fontSize);

                if (rainDrops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    rainDrops[i] = 0;
                }
                rainDrops[i]++;
            }
            requestAnimationFrame(drawMatrix);
        }
        requestAnimationFrame(drawMatrix);


        // --- 2. EFEITO MAQUINA DE ESCREVER DO TERMINAL ---
        const textLines = [
            "> [SISTEMA]: Inicializando varredura de núcleo...\n",
            "> [AVISO]: Defesas corrompidas por uma força externa.\n",
            "> [STATUS]: Segurança falhou. O motivo? <span class='pink-text'>Você.</span>\n",
            "> [LOG]: Não existem linhas de código capazes de mensurar o que sinto.\n",
            "> [LOG]: Tentei criptografar, mas meu peito só sabe dizer o seu nome...\n",
            "> [SISTEMA]: <span class='pink-text'>Julia</span>, você invadiu meu sistema por completo.\n",
            "> Pronto para acessar o banco de dados do meu coração?<span class='blink'>_</span>"
        ];

        const outputDiv = document.getElementById('terminalText');
        const btnContainer = document.getElementById('btnContainer');
        
        let lineIndex = 0;
        let charIndex = 0;
        let currentHTML = "";

        function typeWriter() {
            if (lineIndex < textLines.length) {
                let currentLine = textLines[lineIndex];

                // Remove o cursor piscante da linha anterior se necessário antes de avançar
                if (lineIndex > 0 && lineIndex === textLines.length - 1) {
                    outputDiv.innerHTML = outputDiv.innerHTML.replace("<span class=\"blink\">_</span>", "");
                }

                // Identifica se há tags HTML para renderizar o bloco de cor de uma vez só
                if (currentLine.charAt(charIndex) === "<") {
                    let tagEnd = currentLine.indexOf(">", charIndex);
                    let closingTagEnd = currentLine.indexOf(">", tagEnd + 1);
                    outputDiv.innerHTML += currentLine.substring(charIndex, closingTagEnd + 1);
                    charIndex = closingTagEnd + 1;
                } else {
                    outputDiv.innerHTML += currentLine.charAt(charIndex);
                    charIndex++;
                }

                if (charIndex < currentLine.length) {
                    setTimeout(typeWriter, 35);
                } else {
                    lineIndex++;
                    charIndex = 0;
                    setTimeout(typeWriter, 500);
                }
            } else {
                btnContainer.classList.add('show');
            }
        }

        function bypassSystem() {
            window.location.href = "hackerLove.html";
        }

        window.onload = () => {
            // Pequeno delay para começar a digitar após a chuva iniciar
            setTimeout(typeWriter, 500);
        };
    </script>
</body>
</html>
