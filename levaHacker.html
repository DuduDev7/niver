<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aviso do Sistema</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body,
      html {
        width: 100%;
        min-height: 100%;
        background-color: #050005;
        font-family: 'Courier New', Courier, monospace;
        overflow-x: hidden;
        overflow-y: auto;
        position: relative;
      }
      /* Canvas da chuva hacker de fundo */
      canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
      }
      /* Terminal sobreposto ao canvas */
      .terminal {
        margin: 120px auto;
        width: 90%;
        max-width: 700px;
        background: rgba(5, 0, 5, 0.9); /* Fundo escuro semi-transparente */
        border: 2px solid #00ff66;
        border-radius: 8px;
        padding: 25px;
        box-shadow: 0 0 30px rgba(0, 255, 102, 0.2),
          0 0 30px rgba(255, 40, 140, 0.2);
        position: relative;
        z-index: 2;
      }
      .terminal-header {
        display: flex;
        gap: 8px;
        margin-bottom: 20px;
        border-bottom: 1px solid rgba(0, 255, 102, 0.3);
        padding-bottom: 10px;
      }
      .dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background-color: #00ff66;
        opacity: 0.6;
      }
      .dot.pink {
        background-color: #ff288c;
      }
      .output {
        font-size: 16px;
        line-height: 1.6;
        min-height: 180px;
        white-space: pre-wrap;
        margin-bottom: 30px;
        color: #00ff66; /* Texto principal em verde */
        text-shadow: 0 0 5px rgba(0, 255, 102, 0.5);
      }
      /* Destaca partes do texto em rosa dentro do terminal */
      .pink-text {
        color: #ff288c;
        text-shadow: 0 0 5px rgba(255, 40, 140, 0.5);
      }
      .blink {
        animation: blinker 1s linear infinite;
        font-weight: bold;
      }
      @keyframes blinker {
        50% {
          opacity: 0;
        }
      }
      .btn-container {
        display: flex;
        justify-content: center;
        opacity: 0;
        transition: opacity 1s ease-in-out;
      }
      .btn-container.show {
        opacity: 1;
      }
      .action-btn {
        background: transparent;
        border: 2px solid #ff288c;
        color: #ff288c;
        padding: 12px 30px;
        font-family: 'Arial Black', sans-serif;
        font-size: 14px;
        cursor: pointer;
        text-transform: uppercase;
        letter-spacing: 2px;
        transition: all 0.3s ease;
        box-shadow: 0 0 15px rgba(255, 40, 140, 0.2);
      }
      .action-btn:hover {
        background: #00ff66;
        border-color: #00ff66;
        color: #050005;
        box-shadow: 0 0 25px #00ff66, 0 0 50px rgba(0, 255, 102, 0.5);
        transform: scale(1.05);
      }

      .scroll-final {
        position: relative;

        z-index: 2;

        width: 90%;
        max-width: 700px;

        margin: 0 auto 120px;

        text-align: center;

        color: #00ff66;
      }

      .scroll-final h2 {
        font-size: 55px;

        margin-bottom: 40px;

        animation: float 2s infinite;
      }

      .scroll-final p {
        margin: 35px 0;

        font-size: 20px;

        line-height: 1.8;
      }

      .scroll-final .pink {
        color: #ff288c;

        font-size: 24px;

        font-weight: bold;
      }

      @keyframes float {
        0%,
        100% {
          transform: translateY(0);
        }

        50% {
          transform: translateY(12px);
        }
      }
    </style>
  </head>
  <body>
    <canvas id="bgCanvas"></canvas>

    <div class="terminal">
      <div class="terminal-header">
        <div class="dot"></div>
        <div class="dot pink"></div>
        <div class="dot"></div>
        <span
          style="
            font-size: 12px;
            margin-left: auto;
            opacity: 0.7;
            color: #00ff66;
          "
          >SYSTEM_OVERRIDE.LOG</span
        >
      </div>
      <div class="output" id="terminalText"></div>
      <div class="btn-container" id="btnContainer">
        <button class="action-btn" onclick="bypassSystem()">
          Descriptografar Sentimentos
        </button>
      </div>
    </div>

    <script>
      // --- 1. CONFIGURAÇÃO DA CHUVA HACKER (VERDE E ROSA) ---
      const canvas = document.getElementById('bgCanvas')
      const ctx = canvas.getContext('2d')

      function resizeCanvas() {
        canvas.width = window.innerWidth
        canvas.height = window.innerHeight
      }
      resizeCanvas()
      window.addEventListener('resize', resizeCanvas)

      const chars = '01EUTEAMOILOVEYOU10♥'.split('')
      const fontSize = 14
      let columns = Math.floor(canvas.width / fontSize)
      let rainDrops = Array(columns).fill(1)

      window.addEventListener('resize', () => {
        columns = Math.floor(canvas.width / fontSize)
        rainDrops = Array(columns).fill(1)
      })

      function drawMatrix() {
        ctx.fillStyle = 'rgba(5, 0, 5, 0.08)' // Rastro preto sutil
        ctx.fillRect(0, 0, canvas.width, canvas.height)

        ctx.font = fontSize + 'px monospace'
        for (let i = 0; i < rainDrops.length; i++) {
          const char = chars[Math.floor(Math.random() * chars.length)]

          // Escolha alternada entre Verde Neon e Rosa Choque para o fundo
          if (Math.random() > 0.5) {
            ctx.fillStyle = `rgba(0, 255, 102, ${Math.random() * 0.15 + 0.05})` // Verde fraco de fundo
          } else {
            ctx.fillStyle = `rgba(255, 40, 140, ${Math.random() * 0.15 + 0.05})` // Rosa fraco de fundo
          }

          ctx.fillText(char, i * fontSize, rainDrops[i] * fontSize)

          if (
            rainDrops[i] * fontSize > canvas.height &&
            Math.random() > 0.975
          ) {
            rainDrops[i] = 0
          }
          rainDrops[i]++
        }
        requestAnimationFrame(drawMatrix)
      }
      requestAnimationFrame(drawMatrix)

      // --- 2. EFEITO MAQUINA DE ESCREVER DO TERMINAL ---
      const textLines = [
        '> [BOOT]: Iniciando protocolo de segurança...\n',

        '> [OK]: Kernel carregado com sucesso.\n',

        '> [OK]: Memória sincronizada.\n',

        '> [OK]: Banco de dados encontrado.\n',

        '> [SCAN]: Procurando ameaças...\n',

        '> [OK]: Nenhum vírus encontrado.\n',

        '> [SCAN]: Verificando arquivos protegidos...\n',

        '> [ALERTA]: Arquivo criptografado detectado.\n',

        '> [STATUS]: Nível de proteção: MÁXIMO.\n',

        '> [TENTATIVA 01]: Quebrando criptografia AES-256...\n',

        '> [FALHA]: Acesso negado.\n',

        '> [TENTATIVA 02]: Forçando acesso ao núcleo emocional...\n',

        '> [FALHA]: Firewall respondeu com sucesso.\n',

        '> [ANÁLISE]: Esse arquivo não utiliza algoritmos conhecidos.\n',

        '> [ANÁLISE]: Não parece ter sido criado por um computador.\n',

        '> [ANÁLISE]: Parece... humano.\n',

        '> [LOG]: Detectando milhares de registros...\n',

        '> [LOG]: Todos possuem o mesmo nome.\n',

        "> [LOG]: <span class='pink-text'>Julia</span>\n",

        '> [ERRO]: O sistema não consegue explicar esse comportamento.\n',

        '> [ERRO]: Toda memória acessada leva ao mesmo destino.\n',

        '> [ERRO]: Todo pensamento retorna para a mesma pessoa.\n',

        '> [SCAN]: Tentando remover o processo...\n',

        '> [FALHA]: Processo impossível de encerrar.\n',

        '> [STATUS]: O arquivo está profundamente integrado ao sistema.\n',

        '> [LOG]: Cada sorriso registrado aumentou o uso de memória.\n',

        '> [LOG]: Cada abraço alterou permanentemente o núcleo do sistema.\n',

        '> [LOG]: Cada conversa criou novos arquivos impossíveis de apagar.\n',

        '> [AVISO]: A estrutura lógica começou a falhar.\n',

        '> [AVISO]: Emoções detectadas.\n',

        '> [AVISO]: Muitas emoções detectadas.\n',

        '> [ERRO CRÍTICO]: O coração assumiu prioridade sobre a razão.\n',

        '> [SISTEMA]: Tentando restaurar configurações originais...\n',

        '> [FALHA].\n',

        '> [FALHA].\n',

        '> [FALHA].\n',

        '> [DIAGNÓSTICO]: Não existe restauração possível.\n',

        '> [LOG]: Você não invadiu apenas este computador...\n',

        '> [LOG]: Você invadiu completamente quem o criou.\n',

        '> [LOG]: O sistema inteiro agora gira em torno de você.\n',

        '> [PROCESSO]: Descriptografando último arquivo protegido...\n',

        '> [PROCESSO]: 17%...\n',

        '> [PROCESSO]: 39%...\n',

        '> [PROCESSO]: 58%...\n',

        '> [PROCESSO]: 81%...\n',

        '> [PROCESSO]: 99%...\n',

        '> [SUCESSO]: Arquivo desbloqueado.\n',

        '> [NOME DO ARQUIVO]: sentimentos_reais.enc\n',

        '> [OBSERVAÇÃO]: Conteúdo extremamente confidencial.\n',

        '> [OBSERVAÇÃO]: Este arquivo jamais deveria ser visto por outra pessoa.\n',

        '> [OBSERVAÇÃO]: Mas... talvez exista uma exceção.\n',

        "> [DESTINATÁRIA]: <span class='pink-text'>Julia</span>\n",

        '> [PERMISSÃO]: Acesso concedido.\n',

        '> [SISTEMA]: Preparando revelação final...\n',

        '> [STATUS]: Todo o sistema concorda com uma única informação.\n',

        '> [STATUS]: Você é o lugar onde meu coração decidiu morar.\n',

        "> Pressione o botão abaixo para abrir o arquivo mais importante que existe.<span class='blink'>_</span>"
      ]

      const outputDiv = document.getElementById('terminalText')
      const btnContainer = document.getElementById('btnContainer')

      let lineIndex = 0
      let charIndex = 0
      let currentHTML = ''

      function typeWriter() {
        if (lineIndex < textLines.length) {
          let currentLine = textLines[lineIndex]

          // Remove o cursor piscante da linha anterior se necessário antes de avançar
          if (lineIndex > 0 && lineIndex === textLines.length - 1) {
            outputDiv.innerHTML = outputDiv.innerHTML.replace(
              '<span class="blink">_</span>',
              ''
            )
          }

          // Identifica se há tags HTML para renderizar o bloco de cor de uma vez só
          if (currentLine.charAt(charIndex) === '<') {
            let tagEnd = currentLine.indexOf('>', charIndex)
            let closingTagEnd = currentLine.indexOf('>', tagEnd + 1)
            outputDiv.innerHTML += currentLine.substring(
              charIndex,
              closingTagEnd + 1
            )
            charIndex = closingTagEnd + 1
          } else {
            outputDiv.innerHTML += currentLine.charAt(charIndex)
            charIndex++
          }

          if (charIndex < currentLine.length) {
            setTimeout(typeWriter, 35)
          } else {
            lineIndex++
            charIndex = 0
            setTimeout(typeWriter, 500)
          }
        } else {
          btnContainer.classList.add('show')
        }
      }

      function bypassSystem() {
        window.location.href = 'hackerLove.html'
      }

      window.onload = () => {
        // Pequeno delay para começar a digitar após a chuva iniciar
        setTimeout(typeWriter, 500)
      }
    </script>
  </body>
</html>
