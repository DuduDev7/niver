<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Você Julia ❤️</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Romantic & Elegant Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;600;700&family=Great+Vibes&family=Fira+Code:wght@400;500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #030206;
            color: #e2e8f0;
            overflow-x: hidden;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Beautiful Romantic Cursive Fonts */
        .font-cursive {
            font-family: 'Great Vibes', cursive;
        }

        .font-handwriting {
            font-family: 'Dancing Script', cursive;
        }

        .font-code {
            font-family: 'Fira Code', monospace;
        }

        /* Glassmorphism Card Style */
        .glass-card {
            background: rgba(18, 10, 26, 0.82);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(236, 72, 153, 0.35);
            box-shadow: 0 0 35px rgba(236, 72, 153, 0.3), inset 0 0 15px rgba(236, 72, 153, 0.15);
        }

        /* Heart Pulse Glow Animation */
        @keyframes heartPulse {
            0%, 100% {
                transform: scale(1);
                filter: drop-shadow(0 0 15px rgba(244, 114, 182, 0.8));
            }
            50% {
                transform: scale(1.15);
                filter: drop-shadow(0 0 32px rgba(236, 72, 153, 1));
            }
        }

        .animate-heart-pulse {
            animation: heartPulse 1.8s infinite ease-in-out;
        }

        /* Romantic Gradient Button */
        .btn-romantic {
            background: linear-gradient(135deg, #ec4899 0%, #be185d 100%);
            box-shadow: 0 0 25px rgba(236, 72, 153, 0.6);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-romantic:hover {
            box-shadow: 0 0 40px rgba(236, 72, 153, 0.9);
            transform: translateY(-2px) scale(1.04);
        }

        .btn-romantic:active {
            transform: translateY(1px) scale(0.98);
        }

        /* Glowing Neon Text Effect for Love Phrases */
        .glowing-love-text {
            color: #fbcfe8;
            text-shadow: 
                0 0 5px rgba(244, 114, 182, 0.8),
                0 0 12px rgba(236, 72, 153, 0.6),
                0 0 20px rgba(219, 39, 119, 0.4);
            line-height: 1.4;
        }

        /* Blinking Typing Cursor */
        .typing-cursor {
            display: inline-block;
            width: 3px;
            height: 1.2em;
            background-color: #f472b6;
            margin-left: 3px;
            vertical-align: middle;
            animation: blink 0.8s infinite;
            box-shadow: 0 0 10px #ec4899;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #030206;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(236, 72, 153, 0.4);
            border-radius: 3px;
        }
    </style>
</head>
<!-- Screen 2: Grande declaração -->
<div id="writingContainer"
    class="fixed inset-0 z-10 p-5 sm:p-8 pt-20 pb-32 overflow-y-auto pointer-events-none hidden opacity-0 transition-opacity duration-1000">

    <div id="loveTextWrapper"
        class="max-w-4xl mx-auto w-full font-handwriting text-2xl sm:text-3xl md:text-4xl glowing-love-text leading-relaxed tracking-wide">

        <span id="typedContent"></span>
        <span id="cursor" class="typing-cursor hidden"></span>

    </div>
</div>


<!-- Screen 3: Declaração final -->
<div id="finalCard"
    class="fixed z-30 bottom-5 sm:bottom-8 inset-x-4 sm:inset-x-auto mx-auto max-w-3xl w-full hidden opacity-0 transition-all duration-1000 pointer-events-none">

    <div class="glass-card rounded-3xl p-7 sm:p-10 text-center pointer-events-auto border border-pink-500/40 shadow-2xl">

        <div class="text-4xl sm:text-5xl text-pink-400 mb-4 animate-bounce">
            ❤️
        </div>

        <h2 id="finalTitle"
            class="text-3xl sm:text-4xl md:text-5xl font-bold text-pink-100 mb-5 tracking-wide font-cursive drop-shadow-[0_0_15px_rgba(236,72,153,0.8)]">
            Eu te amo, Julia.
        </h2>

        <p id="finalMessage"
            class="text-base sm:text-lg text-pink-200/90 leading-relaxed mb-7 font-light">
            E se algum dia você esquecer o tamanho do espaço que ocupa na minha vida,
            volte aqui. Eu vou continuar tendo motivos para te lembrar.
        </p>

        <div class="flex flex-wrap justify-center gap-3">

            <button id="btnExplode"
                class="btn-romantic px-6 py-3 rounded-full text-sm sm:text-base font-medium text-white tracking-wide shadow-lg active:scale-95 transition-all">
                💥 Explodir meus sentimentos
            </button>

            <div
                class="inline-flex items-center gap-2 px-4 py-3 rounded-full bg-pink-500/20 text-pink-300 text-xs sm:text-sm font-code border border-pink-500/30">
                <span>✨ Toque na tela ou arraste o dedo ✨</span>
            </div>

        </div>

    </div>
</div>

    <script>
        // DOM Elements
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');
        const introScreen = document.getElementById('introScreen');
        const btnContinue = document.getElementById('btnContinue');
        const writingContainer = document.getElementById('writingContainer');
        const typedContent = document.getElementById('typedContent');
        const cursor = document.getElementById('cursor');
        const finalCard = document.getElementById('finalCard');
        const topHUD = document.getElementById('topHUD');
        const heartCounterEl = document.getElementById('heartCounter');
        const btnSoundToggle = document.getElementById('btnSoundToggle');
        const soundIcon = document.getElementById('soundIcon');
        const btnSpeedToggle = document.getElementById('btnSpeedToggle');
        const speedLabel = document.getElementById('speedLabel');
        const btnExplode = document.getElementById('btnExplode');

        let width = window.innerWidth;
        let height = window.innerHeight;

        // State & Counter
        let state = 'INTRO';
        let totalHeartsCreated = 0;
        let typingDelay = 12; // High-speed typing delay in ms
        let soundEnabled = false;

        // Web Audio Synthesizer for Chime Sounds
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (AudioContext) {
                    audioCtx = new AudioContext();
                }
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playChime(freq = 523.25, type = 'sine', duration = 0.15) {
            if (!soundEnabled || !audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {}
        }

        function playTypeSound() {
            if (!soundEnabled) return;
            const freqs = [523.25, 587.33, 659.25, 698.46, 783.99, 880.00];
            const randomFreq = freqs[Math.floor(Math.random() * freqs.length)];
            playChime(randomFreq, 'sine', 0.08);
        }

        // Resize Canvas dynamically
        function resizeCanvas() {
            const dpr = window.devicePixelRatio || 1;
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.scale(dpr, dpr);
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Increment Heart Counter
        function addHeartCount(count = 1) {
            totalHeartsCreated += count;
            heartCounterEl.textContent = totalHeartsCreated;
            heartCounterEl.classList.add('scale-125', 'text-pink-300');
            setTimeout(() => {
                heartCounterEl.classList.remove('scale-125', 'text-pink-300');
            }, 150);
        }

        // --- BACKGROUND AMBIENT ORBS ---
        class Orb {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.radius = Math.random() * 50 + 25;
                this.vx = (Math.random() - 0.5) * 0.4;
                this.vy = (Math.random() - 0.5) * 0.4;
                this.alpha = Math.random() * 0.25 + 0.1;
                this.hue = [320, 340, 280, 300][Math.floor(Math.random() * 4)];
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                if (this.x < -this.radius || this.x > width + this.radius || this.y < -this.radius || this.y > height + this.radius) {
                    this.reset();
                }
            }
            draw() {
                ctx.save();
                ctx.globalCompositeOperation = 'screen';
                const g = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.radius);
                g.addColorStop(0, `hsla(${this.hue}, 90%, 65%, ${this.alpha})`);
                g.addColorStop(1, `hsla(${this.hue}, 80%, 30%, 0)`);
                ctx.fillStyle = g;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        // --- FLOATING HEARTS ---
        class FloatingHeart {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * width;
                this.y = height + Math.random() * 50;
                this.size = Math.random() * 14 + 10;
                this.speedY = Math.random() * 0.9 + 0.4;
                this.speedX = Math.sin(Math.random() * Math.PI) * 0.5;
                this.alpha = Math.random() * 0.5 + 0.3;
                this.hue = Math.random() * 40 + 320;
            }
            update() {
                this.y -= this.speedY;
                this.x += this.speedX;
                if (this.y < -30) {
                    this.reset();
                }
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = `hsl(${this.hue}, 100%, 75%)`;
                ctx.shadowColor = `hsl(${this.hue}, 100%, 60%)`;
                ctx.shadowBlur = 8;
                ctx.font = `${this.size}px sans-serif`;
                ctx.fillText('❤️', this.x, this.y);
                ctx.restore();
            }
        }

        // --- MOUSE / TOUCH TRAIL DUST PARTICLES ---
        class TrailParticle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.size = Math.random() * 8 + 4;
                this.vx = (Math.random() - 0.5) * 1.5;
                this.vy = (Math.random() - 0.5) * 1.5 - 0.5;
                this.alpha = 1;
                this.decay = Math.random() * 0.03 + 0.02;
                this.hue = Math.random() * 40 + 320;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= this.decay;
            }
            draw() {
                if (this.alpha <= 0) return;
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = `hsl(${this.hue}, 100%, 75%)`;
                ctx.shadowColor = `hsl(${this.hue}, 100%, 60%)`;
                ctx.shadowBlur = 10;
                ctx.font = `${this.size}px sans-serif`;
                ctx.fillText('✨', this.x, this.y);
                ctx.restore();
            }
        }

        // --- INTERACTIVE HEART FIREWORKS PARTICLES ---
        class InteractiveHeartParticle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                const t = Math.random() * Math.PI * 2;
                const heartScale = Math.random() * 3 + 1.5;
                
                // Parametric heart formula
                const vx = 16 * Math.pow(Math.sin(t), 3);
                const vy = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
                
                this.vx = (vx / 8) * heartScale + (Math.random() - 0.5);
                this.vy = (vy / 8) * heartScale + (Math.random() - 0.5);
                this.size = Math.random() * 4 + 2;
                this.alpha = 1;
                this.decay = Math.random() * 0.02 + 0.015;
                this.gravity = 0.04;
                this.hue = Math.random() * 60 + 310;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += this.gravity;
                this.alpha -= this.decay;
            }
            draw() {
                if (this.alpha <= 0) return;
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = `hsl(${this.hue}, 100%, 70%)`;
                ctx.shadowColor = `hsl(${this.hue}, 100%, 60%)`;
                ctx.shadowBlur = 12;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        // Instantiate Background Objects
        const orbs = Array.from({ length: 12 }, () => new Orb());
        const floatingHearts = Array.from({ length: 22 }, () => new FloatingHeart());
        let heartParticles = [];
        let trailParticles = [];

        // --- COMPREHENSIVE LIST OF ROMANTIC DECLARATIONS WITH AFFECTIONATE NICKNAMES ---
        const romanticPhrases = [
            "Eu te amo muito amor",
            "Eu te amo muito Julia",
            "Eu te amo muito minha loira",
            "Eu te amo muito minha princesa",
            "Eu te amo muito Juju",
            "Eu te amo muito mo",
            "Eu te amo muito meu bem",
            "Eu te amo muito minha vida",
            "Eu te amo muito linda",
            "Eu te amo muito meu amor",
            "Eu te amo muito minha gatinha",
            "Eu te amo muito minha perfeitinha",
            "Eu te amo muito meu dengo",
            "Eu te amo muito minha rainha",
            "Eu te amo muito meu tudo",
            "Eu te amo muito minha bebê",
            "Eu te amo muito minha flor",
            "Eu te amo muito minha gracinha",
            "Eu te amo muito meu anjo",
            "Eu te amo muito minha luz",
            "Eu te amo muito minha perfeita",
            "Eu te amo muito minha maravilhosa",
            "Eu te amo muito meu denguinho",
            "Eu te amo muito minha fofura",
            "Eu te amo muito minha vida inteira",
            "Eu te amo muito minha razão de viver",
            "Eu te amo muito minha gostosa",
            "Eu te amo muito meu sol",
            "Eu te amo muito meu tesouro",
            "Eu te amo muito minha paixão"
        ];

        // Typewriter Effect Logic
        let phraseIndex = 0;
        let totalTypedLength = 0;

        function startWritingSequence() {
            state = 'WRITING';
            initAudio();

            // Reveal Top HUD
            topHUD.classList.remove('opacity-0');

            // Hide Intro Screen
            introScreen.style.opacity = '0';
            introScreen.style.transform = 'scale(0.9)';
            setTimeout(() => {
                introScreen.style.display = 'none';
                
                // Reveal Writing Container
                writingContainer.classList.remove('hidden');
                setTimeout(() => {
                    writingContainer.style.opacity = '1';
                    cursor.classList.remove('hidden');
                    typeNextPhrase();
                }, 100);
            }, 800);
        }

        function typeNextPhrase() {
            if (phraseIndex >= romanticPhrases.length) {
                // Continuously loop phrases to keep screen full
                phraseIndex = 0;
            }

            const currentPhrase = romanticPhrases[phraseIndex];
            phraseIndex++;

            let charIdx = 0;
            // Add a leading separator heart if text already exists
            const prefix = typedContent.innerHTML === '' ? '❤️ ' : ' • ❤ ';
            typedContent.innerHTML += prefix;

            const typeInterval = setInterval(() => {
                typedContent.innerHTML += currentPhrase[charIdx];
                charIdx++;

                if (charIdx % 3 === 0) {
                    playTypeSound();
                }

                // Auto-scroll smoothly to keep cursor visible as text fills up
                writingContainer.scrollTop = writingContainer.scrollHeight;

                if (charIdx >= currentPhrase.length) {
                    clearInterval(typeInterval);

                    // Check if container has reached screen fullness
                    const isFull = writingContainer.scrollHeight > (window.innerHeight * 0.85);

                    if (isFull && totalTypedLength > 15 && state !== 'FINAL') {
                        // Conclude writing and show final romantic message card
                        setTimeout(showFinalCard, 800);
                    } else {
                        totalTypedLength++;
                        setTimeout(typeNextPhrase, typingDelay > 10 ? 80 : 30);
                    }
                }
            }, typingDelay); // Super fast typing speed in milliseconds
        }

        function showFinalCard() {
            state = 'FINAL';
            cursor.classList.add('hidden');
            
            // Trigger automatic celebration fireworks
            explodeFireworksCluster();

            // Show final glassmorphism romantic message card
            finalCard.classList.remove('hidden');
            setTimeout(() => {
                finalCard.style.opacity = '1';
                finalCard.style.transform = 'translateY(0)';
            }, 100);
        }

        function explodeFireworksCluster() {
            for(let i = 0; i < 6; i++) {
                setTimeout(() => {
                    const randomX = Math.random() * (width * 0.7) + (width * 0.15);
                    const randomY = Math.random() * (height * 0.5) + (height * 0.15);
                    triggerHeartBurst(randomX, randomY);
                }, i * 250);
            }
        }

        // Trigger Fireworks on Screen Touch / Click
        function triggerHeartBurst(x, y) {
            initAudio();
            playChime(659.25, 'triangle', 0.25);
            addHeartCount(35);

            for (let i = 0; i < 40; i++) {
                heartParticles.push(new InteractiveHeartParticle(x, y));
            }
        }

        // Animation Loop
        function animate() {
            // Dark smooth trail background fill
            ctx.fillStyle = 'rgba(3, 2, 6, 0.35)';
            ctx.fillRect(0, 0, width, height);

            // Render Ambient Orbs
            orbs.forEach(o => { o.update(); o.draw(); });

            // Render Floating Hearts
            floatingHearts.forEach(h => { h.update(); h.draw(); });

            // Render Mouse Trail Dust
            for (let i = trailParticles.length - 1; i >= 0; i--) {
                const tp = trailParticles[i];
                tp.update();
                tp.draw();
                if (tp.alpha <= 0) {
                    trailParticles.splice(i, 1);
                }
            }

            // Render Interactive Heart Burst Particles
            for (let i = heartParticles.length - 1; i >= 0; i--) {
                const hp = heartParticles[i];
                hp.update();
                hp.draw();
                if (hp.alpha <= 0) {
                    heartParticles.splice(i, 1);
                }
            }

            requestAnimationFrame(animate);
        }

        // Event Listeners
        btnContinue.addEventListener('click', (e) => {
            e.stopPropagation();
            startWritingSequence();
        });

        btnExplode.addEventListener('click', (e) => {
            e.stopPropagation();
            explodeFireworksCluster();
        });

        // Toggle Sound State
        btnSoundToggle.addEventListener('click', (e) => {
            e.stopPropagation();
            soundEnabled = !soundEnabled;
            if (soundEnabled) {
                initAudio();
                soundIcon.textContent = '🔊';
                playChime(880, 'sine', 0.2);
            } else {
                soundIcon.textContent = '🔇';
            }
        });

        // Toggle Typing Speed
        btnSpeedToggle.addEventListener('click', (e) => {
            e.stopPropagation();
            if (typingDelay === 12) {
                typingDelay = 4; // Ultra fast
                speedLabel.textContent = '⚡⚡ Max';
            } else {
                typingDelay = 12; // Standard fast
                speedLabel.textContent = '2x';
            }
        });

        // Pointer Motion (Mouse & Touch Drag) Trail Creation
        function handlePointerMove(x, y) {
            if (state === 'WRITING' || state === 'FINAL') {
                for (let i = 0; i < 2; i++) {
                    trailParticles.push(new TrailParticle(x, y));
                }
            }
        }

        window.addEventListener('mousemove', (e) => {
            handlePointerMove(e.clientX, e.clientY);
        });

        window.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) {
                handlePointerMove(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, { passive: true });

        // Click or Tap anywhere on canvas to launch heart explosions
        window.addEventListener('click', (e) => {
            if (state === 'WRITING' || state === 'FINAL') {
                triggerHeartBurst(e.clientX, e.clientY);
            }
        });

        window.addEventListener('touchstart', (e) => {
            if ((state === 'WRITING' || state === 'FINAL') && e.touches.length > 0) {
                triggerHeartBurst(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, { passive: true });

        // Start Animation Loop on Load
        window.onload = () => {
            resizeCanvas();
            animate();
        };
    </script>
</body>
</html>
