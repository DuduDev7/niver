<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>A Matemática Também Ama</title>

    <link rel="stylesheet" href="style2.css">

</head>

<body>

    <!-- Fundo -->
    <div class="math-bg"></div>

    <!-- Grid cartesiano -->
    <div class="grid"></div>

    <!-- Pontos brilhando -->
    <div id="particles"></div>

    <main class="math-page">

        <section class="math-card">

            <div class="math-icon">

                ∑

            </div>

            <h1 id="titulo"></h1>

            <div class="divider"></div>

            <p id="linha1"></p>

            <p id="linha2"></p>

            <p id="linha3"></p>

            <p id="linha4"></p>

            <p id="linha5"></p>

            <p id="linha6"></p>

            <div class="equation-box">

                <small>

                    A matemática consegue desenhar um coração.

                </small>

                <div id="equacao"></div>

            </div>

            <div class="final-text">

                <h2 id="fraseFinal"></h2>

            </div>

            <div class="buttons">

                <button id="btnGeo">

                    ❤️ Ver o coração

                </button>

                <button onclick="window.location.href='home.html'">

                    ← Voltar

                </button>

            </div>

        </section>

    </main>

    <script src="js/script2.js"></script>

</body>

</html>
