const FINAL="Você percorreu cem maneiras de dizer a mesma coisa. Em diferentes lugares, com diferentes palavras e diferentes sons, uma mensagem continuou voltando: eu te amo.";
const $=i=>document.getElementById(i),RAD=Math.PI/180,TAU=Math.PI*2;
const ld=k=>{try{return JSON.parse(localStorage.getItem(k))||[]}catch(e){return[]}};

const cv=$('g'),x=cv.getContext('2d');
let W,H,R=200,cx=0,cy=0,yaw=0,pit=.35,vy=0,vp=0,drag=null,tgt=null,cur=null,P=[],hov=null,moved=0;
const BG=Array.from({length:150},()=>({x:Math.random(),y:Math.random(),r:Math.random()*1.3+.2,s:Math.random()*6}));
const GR=[];for(let lo=0;lo<360;lo+=30){const l=[];for(let la=-90;la<=90;la+=6)l.push([la,lo]);GR.push(l)}
for(let la=-60;la<=60;la+=30){const l=[];for(let lo=0;lo<=360;lo+=6)l.push([la,lo]);GR.push(l)}
function size(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;x.setTransform(d,0,0,d,0,0)}
addEventListener('resize',size);size();
const mob=()=>W<760;
function proj(la,lo){const p=la*RAD,l=lo*RAD-yaw,cp=Math.cos(pit),sp=Math.sin(pit),c=Math.cos(p);return{x:c*Math.sin(l),y:cp*Math.sin(p)-sp*c*Math.cos(l),z:sp*Math.sin(p)+cp*c*Math.cos(l)}}
function frame(t){
 yaw=((yaw%TAU)+TAU)%TAU;
 if(!drag){if(!tgt&&cur==null)yaw+=.0014;yaw-=vy;pit=Math.max(-1.25,Math.min(1.25,pit+vp));vy*=.94;vp*=.94}
 if(tgt){const a=((tgt.y-yaw+3*Math.PI)%TAU)-Math.PI;yaw+=a*.08;pit+=(tgt.p-pit)*.08;if(Math.abs(a)<.004&&Math.abs(tgt.p-pit)<.004)tgt=null}
 const m=mob(),open=cur!=null;
 const tR=m?(open?Math.min(W*.36,H*.17):Math.min(W*.44,(H-190)/2)):Math.min((open?W*.28:W*.36),(H-170)/2);
 const tx=!m&&open?W*.3:W/2,ty=m&&open?H*.2:(H-10)/2+(m?0:10);
 R+=(tR-R)*.08;cx+=(tx-cx)*.08;cy+=(ty-cy)*.08;

function draw(t){
 x.clearRect(0,0,W,H);
 BG.forEach(b=>{const X=((b.x*W*1.2-yaw*40)%W+W)%W;x.globalAlpha=.25+.5*Math.abs(Math.sin(t/900+b.s));x.fillStyle='#fff';x.fillRect(X,b.y*H,b.r,b.r)});
 x.globalAlpha=1;
 let g=x.createRadialGradient(cx,cy,R*.88,cx,cy,R*1.25);g.addColorStop(0,'rgba(217,56,88,.28)');g.addColorStop(.45,'rgba(138,48,127,.12)');g.addColorStop(1,'rgba(138,48,127,0)');

 g=x.createRadialGradient(cx-R*.35,cy-R*.35,R*.1,cx,cy,R);g.addColorStop(0,'rgba(90,34,76,.65)');g.addColorStop(.7,'rgba(28,10,34,.8)');g.addColorStop(1,'rgba(10,4,14,.95)');

 GR.forEach(l=>{x.beginPath();let on=0;for(const[la,lo]of l){const p=proj(la,lo);if(p.z>0){const X=cx+R*p.x,Y=cy-R*p.y;on?x.lineTo(X,Y):x.moveTo(X,Y);on=1}else on=0}x.stroke()});
