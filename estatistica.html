<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Estatísticas</title>

    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="center">
    <canvas id="hearts"></canvas>
      <div class="container">
        <h1>Estatísticas da dupla</h1>

        <div class="stats">
          <div class="stat">
            <p>Carinho</p>

            <div class="barra">
              <div class="progresso p1"></div>
            </div>

            <span>100%</span>
          </div>

          <div class="stat">
            <p>Ciúmes</p>

            <div class="barra">
              <div class="progresso p2"></div>
            </div>

            <span>100%</span>
          </div>

          <div class="stat">
            <p>Beleza Absurda</p>

            <div class="barra">
              <div class="progresso p3"></div>
            </div>

            <span>100%</span>
          </div>

          <div class="stat">
            <p>Compatibilidade</p>

            <div class="barra">
              <div class="progresso p4"></div>
            </div>

            <span>100%</span>
          </div>
        </div>
      </div>

    <a class="back-btn" href="home.html">⬅ Voltar</a>
    <script src="js/hearts.js"></script>
    <script src="js/script.js"></script>
